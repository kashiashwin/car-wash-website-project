<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Mycarwash</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="login">
  <header class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-icon"><i class="fa-solid fa-droplet"></i></div>
      <div class="brand-text">
        <div class="brand-name">Mycarwash</div>
        <div class="brand-tag">Premium Car Wash</div>
      </div>
    </a>
    <nav class="nav-links">
      <a class="nav-btn" href="index.html" data-nav="home"><i class="fa-solid fa-house"></i> Home</a>
      <a class="nav-btn" href="services.html" data-nav="services"><i class="fa-solid fa-droplet"></i> Services</a>
      <a class="nav-btn" href="history.html" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i>
        History</a>
      <a class="nav-btn" href="profile.html" data-nav="profile"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>
    <div class="nav-right">
      <a class="login-btn" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a class="book-btn" href="services.html">Book Now</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a class="nav-btn" href="index.html" data-nav="home"><i class="fa-solid fa-house"></i> Home</a>
      <a class="nav-btn" href="services.html" data-nav="services"><i class="fa-solid fa-droplet"></i> Services</a>
      <a class="nav-btn" href="history.html" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i>
        History</a>
      <a class="nav-btn" href="profile.html" data-nav="profile"><i class="fa-solid fa-user"></i> Profile</a>
      <a class="login-btn" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth="signin">Sign In</button>
        <button class="auth-tab" data-auth="signup">Sign Up</button>
      </div>

      <form class="auth-form" id="signinForm">
        <h1>Welcome Back</h1>
        <p class="muted">Sign in to book your next wash</p>
        <label>
          <span>Email</span>
          <input type="text" id="signinEmail" required placeholder="you@example.com" />
        </label>
        <label>
          <span>Password</span>
          <div class="password-wrapper">
            <input type="password" id="signinPassword" required placeholder="••••••••" />
            <button type="button" class="toggle-password" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </label>
        <div class="row-between">
          <label class="check"><input type="checkbox" /> Remember me</label>
          <a href="#" class="link">Forgot password?</a>
        </div>
        <button type="submit" class="book-btn full">Sign In</button>

        <div class="divider"><span>or continue with</span></div>
        <div class="oauth-row">
          <button type="button" class="oauth-btn"><i class="fa-brands fa-google"></i> Google</button>
          <button type="button" class="oauth-btn"><i class="fa-brands fa-apple"></i> Apple</button>
        </div>
      </form>

      <form class="auth-form hidden" id="signupForm">
        <h1>Create Account</h1>
        <p class="muted">Start booking premium washes today</p>
        <label>
          <span>Full Name</span>
          <input type="text" id="signupName" required placeholder="Rahul Sharma" />
        </label>
        <label>
          <span>Email</span>
          <input type="email" id="signupEmail" required placeholder="you@example.com" />
        </label>
        <label>
          <span>Phone</span>
          <input type="tel" id="signupPhone" required placeholder="+91 98765 43210" />
        </label>
        <label>
          <span>Password</span>
          <div class="password-wrapper">
            <input type="password" id="signupPassword" required placeholder="••••••••" />
            <button type="button" class="toggle-password" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </label>
        <button type="submit" class="book-btn full">Create Account</button>
      </form>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>

</html>
