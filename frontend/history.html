<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History - Mycarwash</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="history">
  <header class="navbar">
    <a href="index.html" class="brand">
      <div class="brand-icon"><i class="fa-solid fa-droplet"></i></div>
      <div class="brand-text">
        <div class="brand-name">Mycarwash</div>
        <div class="brand-tag">Premium Car Wash</div>
      </div>
    </a>
    <nav class="nav-links">
      <a class="nav-btn" href="index.html" data-nav="home"><i class="fa-solid fa-house"></i> Home</a>
      <a class="nav-btn" href="services.html" data-nav="services"><i class="fa-solid fa-droplet"></i> Services</a>
      <a class="nav-btn" href="history.html" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i>
        History</a>
      <a class="nav-btn" href="profile.html" data-nav="profile"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>
    <div class="nav-right">
      <a class="login-btn" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
      <a class="book-btn" href="services.html">Book Now</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a class="nav-btn" href="index.html" data-nav="home"><i class="fa-solid fa-house"></i> Home</a>
      <a class="nav-btn" href="services.html" data-nav="services"><i class="fa-solid fa-droplet"></i> Services</a>
      <a class="nav-btn" href="history.html" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i>
        History</a>
      <a class="nav-btn" href="profile.html" data-nav="profile"><i class="fa-solid fa-user"></i> Profile</a>
      <a class="login-btn" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
    </div>
  </header>

  <main>
    <section class="page-header">
      <h1>Booking History</h1>
      <p>Your past and upcoming car wash bookings</p>
    </section>

    <div class="history-tabs">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="completed">Completed</button>
      <button class="tab-btn" data-tab="upcoming">Upcoming</button>
      <button class="tab-btn" data-tab="cancelled">Cancelled</button>
    </div>

    <section class="history-list" id="historyList">
      <!-- Dynamically loaded -->
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>

</html>
